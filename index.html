<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRIORITY LUFTHANSA</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #1e1e1e; margin: 0; padding: 12px; color: #ffffff; }
    .container { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .btn-main { background-color: #ff8c00; color: #000; border: none; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; font-size: 15px; }
    .admin-only { display: none !important; }
    body.is-admin .admin-only { display: block !important; }
    .date-box { background: #2a2a2a; border: 1px solid #444; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    .date-title-input { width: 100%; background: transparent; border: none; color: #ff8c00; font-size: 18px; font-weight: bold; padding: 6px 0; }
    .sub-box { background: #333333; border: 1px solid #555; border-radius: 8px; margin-top: 10px; padding: 10px; }
    .sub-text-input { width: 100%; background: transparent; border: none; color: #ffffff; font-size: 15px; padding: 6px 0; }
    .image-container img { max-width: 100%; height: auto; border-radius: 6px; border: 1px solid #555; display: block; margin-top: 8px; }
    .btn-delete { background-color: #444; color: #ff4500; border: 1px solid #ff4500; padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <button style="background:transparent; border:1px solid #444; color:#666; padding:6px; font-size:12px; margin: 0 auto; border-radius: 6px;" onclick="toggleAdmin()">🔒 Admin</button>
    <button class="btn-main admin-only" onclick="addDateBox()">+ Aggiungi Nuova Data</button>
    <div id="calendar-list"></div>
    <button id="btn-save" class="btn-main admin-only" onclick="saveData()">💾 Salva per Tutti</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB9tx_miG8-FaCSkX3uWI1UlEryNRV",
      authDomain: "priority-lufthansa.firebaseapp.com",
      databaseURL: "https://priority-lufthansa-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "priority-lufthansa",
      storageBucket: "priority-lufthansa.appspot.com",
      messagingSenderId: "562249937483",
      appId: "1:562249937483:web:29d94c54f809ad160"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let isAdmin = false;

    function toggleAdmin() {
      const pass = isAdmin ? "" : prompt("Password:");
      if (!isAdmin && pass === "1948") setAdminMode(true);
      else if (isAdmin) setAdminMode(false);
    }

    function setAdminMode(active) {
      isAdmin = active;
      document.body.classList.toggle('is-admin', active);
    }

    function addDateBox(dateText = "Nuova Data", subRowsData = null) {
      const list = document.getElementById('calendar-list');
      const item = document.createElement('div');
      item.className = 'date-box';
      item.innerHTML = `<input type="text" class="date-title-input" value="${dateText}" ${isAdmin ? '' : 'readonly'}><div class="sub-list"></div><button class="admin-only btn-main" style="padding:8px; font-size:13px; margin-top:8px;" onclick="addNewSubRow(this.previousElementSibling)">+ Aggiungi Riga</button><button class="btn-delete admin-only" style="width:100%; margin-top:8px;" onclick="this.closest('.date-box').remove()">Elimina Data</button>`;
      list.appendChild(item);
      const subList = item.querySelector('.sub-list');
      if (subRowsData) subRowsData.forEach(s => addNewSubRow(subList, s));
      else addNewSubRow(subList);
    }

    function addNewSubRow(container, data = {subText: "Nuova riga...", imgSrc: ""}) {
      const div = document.createElement('div');
      div.className = 'sub-box';
      div.innerHTML = `
        <input type="text" class="sub-text-input" value="${data.subText}" ${isAdmin ? '' : 'readonly'}>
        <div class="image-wrapper admin-only" style="margin-top:8px;">
          <input type="file" accept="image/*" onchange="handleImage(this)">
        </div>
        <div class="img-render-area">
          ${data.imgSrc ? `<div class="image-container"><img src="${data.imgSrc}"></div>` : ''}
        </div>
        <button class="btn-delete admin-only" onclick="this.parentElement.remove()">Elimina Riga</button>
      `;
      container.appendChild(div);
    }

    function handleImage(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const imgObj = new Image();
        imgObj.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX = 600;
          let w = imgObj.width, h = imgObj.height;
          if (w > h) { h *= MAX/w; w = MAX; } else { w *= MAX/h; h = MAX; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(imgObj, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.5);
          const area = input.parentElement.nextElementSibling;
          area.innerHTML = `<div class="image-container"><img src="${dataUrl}"></div>`;
        };
        imgObj.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function saveData() {
      const btn = document.getElementById('btn-save');
      btn.innerText = "Salvataggio...";
      const data = [];
      document.querySelectorAll('.date-box').forEach(box => {
        const subRows = [];
        box.querySelectorAll('.sub-box').forEach(sb => {
          const img = sb.querySelector('img');
          subRows.push({ subText: sb.querySelector('.sub-text-input').value, imgSrc: img ? img.src : '' });
        });
        data.push({ dateText: box.querySelector('.date-title-input').value, subRowsData: subRows });
      });
      db.ref('calendario_priority').set(data).then(() => { btn.innerText = "💾 Salva per Tutti"; alert('Fatto!'); });
    }

    db.ref('calendario_priority').on('value', (snapshot) => {
      if (document.activeElement.tagName === 'INPUT') return;
      const list = document.getElementById('calendar-list'); list.innerHTML = '';
      const data = snapshot.val();
      if (data) data.forEach(i => addDateBox(i.dateText, i.subRowsData));
      else addDateBox("8 Agosto");
      setAdminMode(isAdmin);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRIORITY LUFTHANSA</title>
  <style>
    /* Tema PriorityLufthansa: Grigio Scuro e Arancione */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1e1e1e; /* Sfondo Grigio Scuro */
      margin: 0;
      padding: 12px;
      color: #ffffff;
    }

    .logo2-header {
      text-align: center;
      margin: 10px 0 20px 0;
    }

    .logo2-header img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
      margin: 0 auto;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-main {
      background-color: #ff8c00;
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      width: 100%;
    }

    .btn-save {
      background-color: #ff8c00;
      color: #000;
    }

    .btn-add-sub {
      background-color: #333;
      color: #ff8c00;
      border: 1px dashed #ff8c00;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }

    .btn-delete {
      background-color: #444;
      color: #ff4500;
      border: 1px solid #ff4500;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 10px;
      cursor: pointer;
    }

    details.date-box {
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 10px;
      overflow: hidden;
    }

    summary {
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      list-style: none;
      color: #ff8c00;
    }

    summary::-webkit-details-marker { display: none; }

    summary::after {
      content: '▼';
      font-size: 12px;
      color: #ff8c00;
    }

    details[open] > summary::after { transform: rotate(180deg); }

    .sub-content {
      padding: 10px;
      background-color: #252525;
      border-top: 1px solid #444;
    }

    details.sub-box {
      background: #333333;
      border: 1px solid #555;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    details.sub-box summary {
      font-size: 14px;
      font-weight: 500;
      padding: 12px;
      color: #ccc;
    }

    .editable {
      outline: none;
      padding: 2px 4px;
      display: inline-block;
      width: 80%;
      color: #fff;
    }

    /* Bordo tratteggiato visibile solo in modalità Admin */
    body.is-admin .editable {
      border-bottom: 1px dashed #ff8c00;
    }

    .editable:focus {
      background-color: #444;
      border-bottom: 2px solid #ff8c00;
    }

    .image-wrapper {
      padding: 12px;
      text-align: center;
    }

    .image-wrapper img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      margin-top: 10px;
      border: 1px solid #555;
    }

    .file-input {
      font-size: 13px;
      margin-top: 5px;
      width: 100%;
      color: #888;
    }

    /* NASCONDE TUTTI I PULSANTI E LE MODIFICHE AI VISITATORI OSPITI */
    body:not(.is-admin) .admin-only {
      display: none !important;
    }

    .admin-bar {
      text-align: center;
      margin-bottom: 15px;
    }

    .btn-admin-toggle {
      background: transparent;
      border: 1px solid #444;
      color: #666;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Logo al posto del testo -->
  <div class="logo-header">
    <img src="logo.jpg" alt="PRIORITY LUFTHANSA">
  </div>

  <div class="admin-bar">
    <button class="btn-admin-toggle" onclick="toggleAdmin()">🔒 Area Riservata Admin</button>
  </div>

  <div class="container">
    <button class="btn-main admin-only" onclick="addDateBox()">+ Aggiungi Nuova Data</button>

    <div id="calendar-list"></div>

    <button class="btn-main btn-save admin-only" onclick="saveData()">💾 Salva Modifiche</button>
  </div>

  <script>
    let isAdmin = false;
    const ADMIN_PASSWORD = "1948"; // Password impostata su 1948

    document.addEventListener('DOMContentLoaded', () => {
      if (sessionStorage.getItem('priority_admin') === 'true') {
        setAdminMode(true);
      }
      loadData();
    });

    function toggleAdmin() {
      if (isAdmin) {
        setAdminMode(false);
        sessionStorage.removeItem('priority_admin');
        alert("Modalità Ospite attivata (sola lettura).");
      } else {
        const pass = prompt("Inserisci la password di Amministratore:");
        if (pass === ADMIN_PASSWORD) {
          setAdminMode(true);
          sessionStorage.setItem('priority_admin', 'true');
          alert("Accesso eseguito! Ora puoi modificare i contenuti.");
        } else if (pass !== null) {
          alert("Password errata!");
        }
      }
    }

    function setAdminMode(active) {
      isAdmin = active;
      if (active) {
        document.body.classList.add('is-admin');
      } else {
        document.body.classList.remove('is-admin');
      }
      
      document.querySelectorAll('.editable').forEach(el => {
        el.setAttribute('contenteditable', active ? 'true' : 'false');
      });
    }

    function addDateBox(dateText = "1 Agosto", subRowsData = null) {
      const list = document.getElementById('calendar-list');
      const item = document.createElement('details');
      item.className = 'date-box';

      if (!subRowsData) {
        subRowsData = [];
        for (let i = 1; i <= 10; i++) {
          subRowsData.push({ subText: `Sottoriga ${i}...`, imgSrc: "" });
        }
      }

      let subRowsHtml = '';
      subRowsData.forEach((sub) => {
        const hasImg = sub.imgSrc !== "";
        subRowsHtml += `
          <details class="sub-box">
            <summary><span class="editable" contenteditable="${isAdmin}">${sub.subText}</span></summary>
            <div class="image-wrapper">
              <label class="admin-only" style="font-size:12px; color:#aaa; display:block;">Seleziona Immagine:</label>
              <input type="file" accept="image/*" class="file-input admin-only" onchange="compressAndPreview(this)">
              <img src="${sub.imgSrc}" style="display: ${hasImg ? 'block' : 'none'}; margin: 10px auto;">
              <button class="btn-delete admin-only" onclick="this.closest('.sub-box').remove()">Elimina sottoriga</button>
            </div>
          </details>
        `;
      });

      item.innerHTML = `
        <summary><span class="editable" contenteditable="${isAdmin}">${dateText}</span></summary>
        <div class="sub-content">
          <div class="sub-list">${subRowsHtml}</div>
          <button class="btn-add-sub admin-only" onclick="addNewSubRow(this)">+ Aggiungi sottoriga</button>
          <button class="btn-delete admin-only" style="width:100%; margin-top:12px;" onclick="this.closest('.date-box').remove()">Elimina intera Data</button>
        </div>
      `;

      list.appendChild(item);
    }

    function addNewSubRow(btn) {
      const subList = btn.previousElementSibling;
      const count = subList.children.length + 1;
      const newSub = document.createElement('details');
      newSub.className = 'sub-box';
      newSub.innerHTML = `
        <summary><span class="editable" contenteditable="${isAdmin}">Sottoriga ${count}...</span></summary>
        <div class="image-wrapper">
          <label class="admin-only" style="font-size:12px; color:#aaa; display:block;">Seleziona Immagine:</label>
          <input type="file" accept="image/*" class="file-input admin-only" onchange="compressAndPreview(this)">
          <img src="" style="display: none; margin: 10px auto;">
          <button class="btn-delete admin-only" onclick="this.closest('.sub-box').remove()">Elimina sottoriga</button>
        </div>
      `;
      subList.appendChild(newSub);
    }

    function compressAndPreview(input) {
      const file = input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const imgObj = new Image();
        imgObj.src = e.target.result;

        imgObj.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 600;
          const MAX_HEIGHT = 600;
          let width = imgObj.width;
          let height = imgObj.height;

          if (width > height) {
            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
          } else {
            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(imgObj, 0, 0, width, height);
          const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.5);

          const imgTag = input.nextElementSibling;
          imgTag.src = compressedDataUrl;
          imgTag.style.display = 'block';
        };
      };
      reader.readAsDataURL(file);
    }

    function saveData() {
      const dateBoxes = document.querySelectorAll('.date-box');
      const data = [];
      dateBoxes.forEach(box => {
        const dateText = box.querySelector('summary .editable').innerText;
        const subBoxes = box.querySelectorAll('.sub-box');
        const subRowsData = [];
        subBoxes.forEach(sub => {
          const subText = sub.querySelector('summary .editable').innerText;
          const img = sub.querySelector('.image-wrapper img');
          const imgSrc = (img && img.style.display !== 'none') ? img.src : '';
          subRowsData.push({ subText, imgSrc });
        });
        data.push({ dateText, subRowsData });
      });

      try {
        localStorage.setItem('priorityLufthansaData', JSON.stringify(data));
        alert('PRIORITY LUFTHANSA salvato con successo!');
      } catch(e) {
        alert('Memoria piena, rimuovi qualche foto.');
      }
    }

    function loadData() {
      const saved = localStorage.getItem('priorityLufthansaData');
      if (saved) {
        const data = JSON.parse(saved);
        if (data.length > 0) {
          data.forEach(item => addDateBox(item.dateText, item.subRowsData));
          return;
        }
      }
      addDateBox("1 Agosto");
    }
  </script>
</body>
</html>

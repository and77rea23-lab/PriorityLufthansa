<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRIORITY LUFTHANSA</title>
  <link rel="apple-touch-icon" href="icona.jpg">
  <link rel="icon" type="image/jpeg" href="icona.jpg">
  <style>
    body { font-family: -apple-system, sans-serif; background-color: #1e1e1e; margin: 0; padding: 12px; color: #ffffff; }
    .logo-header { text-align: center; margin: 10px 0 20px 0; }
    .logo-header img { max-width: 100%; height: auto; border-radius: 8px; }
    .container { max-width: 500px; margin: 0 auto; }
    details.date-box { background: #2a2a2a; border: 1px solid #444; border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
    summary { padding: 16px; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; align-items: center; list-style: none; color: #ff8c00; }
    summary::after { content: '▼'; font-size: 12px; }
    details[open] > summary::after { transform: rotate(180deg); }
    .sub-content { padding: 10px; background-color: #252525; border-top: 1px solid #444; }
    .sub-box { background: #333333; border: 1px solid #555; border-radius: 8px; margin-bottom: 8px; padding: 12px; color: #ccc; font-size: 14px; }
  </style>
</head>
<body>

  <div class="logo-header">
    <img src="logo.jpg" alt="PRIORITY LUFTHANSA">
  </div>

  <div class="container" id="calendar-list">
    <!-- Qui verranno caricati i dati -->
  </div>

  <script>
    /* --- CONFIGURAZIONE DATI (Modifica qui per aggiornare il sito per tutti) --- */
    const dati = [
      {
        data: "1 Agosto",
        righe: ["Volo LH1234 - Gate A1", "Volo LH5678 - Gate B2"]
      },
      {
        data: "2 Agosto",
        righe: ["Volo LH9999 - Gate C3"]
      }
    ];
    /* -------------------------------------------------------------------------- */

    function render() {
      const container = document.getElementById('calendar-list');
      container.innerHTML = '';
      
      dati.forEach(item => {
        const div = document.createElement('details');
        div.className = 'date-box';
        
        let subRowsHtml = item.righe.map(riga => `<div class="sub-box">${riga}</div>`).join('');
        
        div.innerHTML = `
          <summary>${item.data}</summary>
          <div class="sub-content">${subRowsHtml}</div>
        `;
        container.appendChild(div);
      });
    }

    render();
  </script>
</body>
</html>
